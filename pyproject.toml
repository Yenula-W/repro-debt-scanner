[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "repro-debt-scanner"
version = "0.1.0"
description = "Scan a research code repository and get a scored, prioritized reproducibility report."
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [{name = "Yenula Wickramasinghe"}]
keywords = ["reproducibility", "research software", "jupyter", "static analysis", "open science"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/Yenula-W/repro-debt-scanner"
Repository = "https://github.com/Yenula-W/repro-debt-scanner"
Issues = "https://github.com/Yenula-W/repro-debt-scanner/issues"
Evaluation = "https://github.com/Yenula-W/repro-debt-scanner/blob/main/EVALUATION.md"

[project.optional-dependencies]
test = ["pytest>=7"]

[project.scripts]
repro-debt = "repro_debt.cli:main"

[tool.setuptools]
packages = ["repro_debt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
