name: CI
on: [push, pull_request]
permissions:
  contents: read
  pull-requests: write
jobs:
  test:
    runs-on: ubuntu-22.04  # last image that still ships Python 3.9 (macOS system Python)
    strategy:
      matrix:
        python-version: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[test]" && pytest -q
  action-self-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: scan
        uses: ./
        with:
          path: examples/messy-lab-repo
          comment: "false"
      - run: test "${{ steps.scan.outputs.grade }}" = "F"
